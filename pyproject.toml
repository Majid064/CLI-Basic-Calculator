[project]
name = "calculator"
version = "0.1.0"
description = "A simple CLI calculator for basic arithmetic operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
calc = "src.main:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
